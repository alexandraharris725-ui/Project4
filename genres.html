        <div class="grid-container">
            <div class="grid-item"
                data-title="Action"
                data-content="Fonts are blocky and simple. Meant to be easily readable. Some popular fonts are Orbitron, Russo One, and Audiowide">
                Action
            </div>
            <div class="grid-item"
                data-title="Adventure"
                data-content="Inspired by open world. They are cursive and script like. Popular fonts are Pirata One and Hassengard">
                Adventure
            </div>
            <div class="grid-item"
                data-title="Arcade"
                data-content="Due to limitations of hardware, typography was 8-bit and only 256 colors. It was common for each game to have their own custom fonts.">
                Arcade
            </div>
            <div class="grid-item"
                data-title="Fantasy"
                data-content="This typography is based on the magic and cursive. Popular fonts are Kodex and Pirate One.">
                Fantasy
            </div>
            <div class="grid-item"
                data-title="Farming"
                data-content="Famring games often use pixel fonts. Inspired by older games they often have their own custom fonts.">
                Farming
            </div>
            <div class="grid-item"
                data-title="Horror"
                data-content="Inspired by  mix of real life elements (camera, handwriting) or simple fonts. Popular fonts are Helvetica, Creepster and Black Witcher">
                Horror
            </div>
            <div class="grid-item"
                data-title="Role-Playing"
                data-content="This genre often overlaps with many other genres. Typography is typically more rounded and fun. Popular fonts are Exocet, Averia Libre, and Alegreya">
                Role-Playing
            </div>
            <div class="grid-item"
                data-title="Simulation"
                data-content="Typography fonts are inspired by what the game is Simulating. Usually a more fun style. Messy not formal. Popular fonts are Roboto, Montserrat, and Consolas">
                Simulation
            </div>
            <div class="grid-item"
                data-title="Sports"
                data-content="Inspired by fonts used in sports broadcast. Jersey M54 (jersey numbers), VTF Redzone Classic (team logos), and Integral CF (banners)">
                Sports
            </div>
            <div class="grid-item"
                data-title="Strategy"
                data-content="The typography is usually simple and formal. Sometimes draws inspieration from traditional stragegy games. Other times typography is inpired by the secondary genre of the game. Popular fonts are Eurostile,  TT Octosquares, Garamond ">
                Strategy
            </div>
        </div>
